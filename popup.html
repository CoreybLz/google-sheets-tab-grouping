<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheets Tab Groups</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      font-size: 13px;
      color: #202124;
      background: #fff;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #e8eaed;
    }

    header svg { flex-shrink: 0; }

    .title { font-size: 14px; font-weight: 500; }
    .subtitle { font-size: 11px; color: #5f6368; margin-top: 1px; }

    section { padding: 12px 16px; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #dadce0;
      flex-shrink: 0;
    }
    .dot.green  { background: #1e8e3e; }
    .dot.yellow { background: #f9ab00; }

    #status-text { color: #5f6368; }

    #user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #f8f9fa;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    #user-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #1a73e8;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #user-name  { font-weight: 500; font-size: 12px; }
    #user-email { font-size: 11px; color: #5f6368; }

    button {
      width: 100%;
      padding: 8px 0;
      border: none;
      border-radius: 5px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s;
    }

    #btn-signin {
      background: #1a73e8;
      color: #fff;
    }
    #btn-signin:hover  { background: #1558b0; }

    #btn-signout {
      background: transparent;
      color: #d93025;
      border: 1px solid #dadce0;
    }
    #btn-signout:hover { background: #fce8e6; }

    #signed-in-view  { display: none; }
    #signed-out-view { display: block; }

    footer {
      padding: 8px 16px 12px;
      font-size: 11px;
      color: #9aa0a6;
      border-top: 1px solid #e8eaed;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <!-- Simple tab-group icon -->
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="13" width="20" height="7" rx="2" fill="#e8eaed"/>
    <rect x="2" y="13" width="9" height="7" rx="2" fill="#1a73e8"/>
    <rect x="2"  y="8" width="7"  height="3" rx="1.5" fill="#1a73e8"/>
    <rect x="13" y="8" width="9"  height="3" rx="1.5" fill="#d93025"/>
  </svg>
  <div>
    <div class="title">Sheets Tab Groups</div>
    <div class="subtitle">Group · Color · Collapse · Sync</div>
  </div>
</header>

<!-- Signed-in state -->
<div id="signed-in-view">
  <section>
    <div id="user-info">
      <div id="user-avatar">?</div>
      <div>
        <div id="user-name">Loading…</div>
        <div id="user-email"></div>
      </div>
    </div>

    <div class="status-row">
      <div class="dot" id="sync-dot"></div>
      <span id="status-text">Checking…</span>
    </div>

    <button id="btn-signout">Sign out</button>
  </section>
</div>

<!-- Signed-out state -->
<div id="signed-out-view">
  <section>
    <p style="color:#5f6368; margin-bottom:12px; line-height:1.5;">
      Sign in with Google to enable tab groups and sync them with teammates.
    </p>
    <button id="btn-signin">Sign in with Google</button>
  </section>
</div>

<footer>Groups are saved in the spreadsheet itself.</footer>

<script src="popup.js"></script>
</body>
</html>
